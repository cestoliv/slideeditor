name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs `prepare`, which builds both halves.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run check

      # `tsc` rewrites no path alias, so this proves the emitted server resolves
      # every import under plain Node.
      - run: npm run check:dist

      - run: npm test

      - run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slide-studio:ci .
      # sharp needs a musl prebuild on this base image, and a missing one
      # otherwise surfaces only as a failed healthcheck after the image is
      # already published. `require` rather than an import: node -e reads an
      # eval string as CommonJS regardless of the package's own module type.
      - name: Loads sharp inside the musl image
        run: docker run --rm --entrypoint node slide-studio:ci -e "require('sharp')"
      # Asserts a failure: the container must refuse to run unconfigured. A
      # container that starts here would be an unauthenticated editor on a
      # published port.
      #
      # `timeout` is what makes the assertion clean. Without it a broken
      # interlock leaves the server running in the foreground, so this step
      # hangs until the job's own timeout rather than reporting why it failed.
      - name: Refuses to start with no password
        run: |
          docker run -d --name ss-nopass slide-studio:ci
          sleep 10
          running=$(docker inspect -f '{{.State.Running}}' ss-nopass)
          code=$(docker inspect -f '{{.State.ExitCode}}' ss-nopass)
          docker logs ss-nopass
          docker rm -f ss-nopass >/dev/null
          if [ "$running" = "true" ]; then
            echo "FAIL: kept running with no password instead of refusing" && exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "FAIL: exited cleanly instead of refusing" && exit 1
          fi
          echo "Refused to start as expected (exit $code)."
      - name: Serves health and guards the API
        run: |
          # Generated per run rather than written into the file. Nothing here
          # depends on a particular value, and a fixed one in the repository is
          # indistinguishable from a real credential.
          pw="ci-$(openssl rand -hex 12)"
          docker run -d --name ss -p 4173:4173 -e SLIDE_STUDIO_PASSWORD="$pw" slide-studio:ci
          for i in $(seq 1 30); do curl -sf localhost:4173/api/health && break; sleep 1; done
          curl -sf localhost:4173/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4173/api/projects)" = "401"
          docker rm -f ss

  # Publishes the image the server pulls. Gated on both jobs above, so nothing
  # reaches the registry unless the whole suite and the container smoke test
  # pass, and a pull request never publishes.
  publish:
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job writes anything. The workflow's own permissions stay
      # read-only, so a change to the jobs above cannot reach the registry.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The built-in token, so there is no secret to create, rotate, or leak.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what the server tracks. The sha tag is immutable, so a
          # rollback pins one rather than hoping an older `latest` still exists.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only: every target VPS is x86, and adding arm64 means QEMU
          # emulation for one of the two and a build several times longer.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
